# 评分权重配置文件
#
# 版本: V2.0（九维度评分体系）
# 创建日期: 2026-03-25
# 更新日期: 2026-07-03
# 作者: 软件架构师
#
# 用途: 为EnhancedWeightedValidator提供动态可配置的评分权重
#       （quality-validator-v1 插件经由它读取，键名与其九维锁定权重对齐，ADR-010）
#
# 权重规则:
# 1. 权重总和应为1.0（允许±10%误差，自动归一化）
# 2. 权重值范围: 0.0-1.0
# 3. 必须包含九个维度（V2.0对齐九维锁定权重，遗留8维键名会被自动映射）
#
# 维度说明（V2.0九维锁定权重）:
# - character: 人设一致性（人物行为符合设定）- 19%
# - style: 风格一致性（语言风格匹配度）- 19%
# - outline: 大纲符合性（情节点覆盖度）- 13%
# - worldview: 世界观一致性（设定冲突检测）- 12%
# - knowledge: 知识库引用（知识库召回和引用）- 8%
# - writing_technique: 写作技巧（叙事技法运用）- 8%
# - word_count: 字数符合性（目标字数达标程度）- 8%
# - context_coherence: 上下文衔接（章节与前文一致性）- 8%
# - ai_feeling: AI感（AI痕迹检测，越低越好的反向维度）- 5%
#
# 总计: 100%
#
# ⚠️ 九维度权重为锁定资产（CLAUDE.md 评分反馈循环5大不可破坏规则之一），
#    本文件默认值即锁定权重；修改会被自动归一化并热更新，请先经架构评审。

version: "2.0"
updated_by: "软件架构师"
last_updated: "2026-07-03T00:00:00"

weights:
  # 人设一致性评分权重（19%）
  character: 0.19

  # 风格一致性评分权重（19%）
  style: 0.19

  # 大纲符合性评分权重（13%）
  outline: 0.13

  # 世界观一致性评分权重（12%）
  worldview: 0.12

  # 知识库引用评分权重（8%）
  knowledge: 0.08

  # 写作技巧评分权重（8%）
  writing_technique: 0.08

  # 字数符合性评分权重（8%）
  word_count: 0.08

  # 上下文衔接评分权重（8%）
  context_coherence: 0.08

  # AI感评分权重（5%）
  ai_feeling: 0.05

# 权重总和: 1.00（无需归一化）

# ============================================================================
# 遗留8维键名映射（V1.1配置仍可读取，自动映射为九维新键）
# ============================================================================
# knowledge_reference → knowledge
# reverse_feedback    → context_coherence
# naturalness         → ai_feeling
# （writing_technique 为九维新增，遗留配置缺失时取当前配置值）

